<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ZED 101.9 FM – Live Radio</title>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="radio-popup">
  <div class="radio-card">
    <img src="assets/zed-logo.png" alt="Zed Multimedia" width="100" height="37">
    <p class="radio-name">ZED 101.9 FM</p>
    <div class="radio-controls">
      <button class="play-btn" data-play aria-label="Play"></button>
      <input type="range" min="0" max="100" value="60" aria-label="Volume" data-volume>
    </div>
    <p class="radio-note" data-radio-note aria-live="polite"></p>
  </div>
  <script src="radio.js"></script>
</body>
</html>
