<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zed Multimedia – New Vision</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="theme.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="site-header"></div>

<main class="container">

  <!-- Hero + latest news -->
  <section class="hero-grid">
    <article class="hero-main" data-hero></article>
    <div class="hero-side" data-hero-side></div>
    <aside class="latest-news" aria-label="Latest news">
      <h3 class="eyebrow">Latest News</h3>
      <ul data-latest></ul>
    </aside>
  </section>

  <!-- Stories + stocks -->
  <section class="stories-grid">
    <div class="stocks-panel">
      <section class="weather-card" data-weather-card aria-label="Weather">
        <div class="weather-head">
          <h3 class="eyebrow">Weather</h3>
          <select data-weather-city aria-label="City"></select>
        </div>
        <div data-weather-body>Loading…</div>
      </section>
      <h3 class="eyebrow">Stocks</h3>
      <table class="stocks-table">
        <thead><tr><th>Symbol</th><th>Price</th><th>Change</th></tr></thead>
        <tbody data-stocks></tbody>
      </table>
      <h3 class="eyebrow">Markets</h3>
      <ul class="mini-market" data-mini-market></ul>
      <p class="fine">Mock data for prototype.</p>
    </div>
    <div class="story-list" data-story-list></div>
  </section>

  <!-- Video -->
  <section class="video-row" data-video></section>

  <!-- Stock market -->
  <section class="section">
    <h2 class="section-title">Stock Market</h2>
    <div class="market-board" data-market></div>
  </section>

  <!-- Banner ad -->
  <div data-banner-ad></div>

  <!-- Politics -->
  <section class="section">
    <h2 class="section-title">Politics</h2>
    <div class="politics-grid" data-politics></div>
  </section>

</main>

<div id="site-footer"></div>

<script src="data.js"></script>
<script src="layout.js"></script>
<script src="app.js"></script>
</body>
</html>
